framework:
  - terraform
download-external-modules: false
compact: true
quiet: false
soft-fail: false
skip-check:
  # CKV_TF_1: el diseño de la plataforma versiona los módulos por tag
  # semántico (vX.Y.Z), no por hash de commit — es la estrategia de
  # versionamiento documentada en terraform-modules, no un descuido. El tag
  # solo se publica si module-ci.yml (fmt/validate/tflint/tfsec/checkov)
  # pasó y el commit pertenece a main.
  - CKV_TF_1
  # CKV2_AWS_34: los parámetros SSM que publica live/ssm.tf no son secretos
  # (ARNs, nombres de recursos, una URL pública) — ya visibles con permiso de
  # solo lectura sobre ECS/ECR. Cifrarlos solo agregaría una dependencia de
  # kms:Decrypt sin reducir exposición real. Es un check de grafo (CKV2_*):
  # el comentario inline #checkov:skip no lo suprime de forma confiable, hay
  # que listarlo aquí.
  - CKV2_AWS_34
