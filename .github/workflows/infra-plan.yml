name: infra-plan

on:
  pull_request:
    branches: [main]
    paths:
      - "live/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  TF_VERSION: "1.9.8"

jobs:
  plan:
    strategy:
      fail-fast: false
      matrix:
        environment: [integracion, laboratorio, produccion]
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    defaults:
      run:
        working-directory: live
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configurar credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: terraform init
        run: terraform init -backend-config=${{ matrix.environment }}.s3.tfbackend -reconfigure -input=false

      - name: terraform validate
        run: terraform validate

      - name: security-scan (tfsec + checkov)
        run: |
          docker run --rm -v "$PWD:/src" aquasec/tfsec /src --soft-fail=false
          pip install --quiet checkov
          checkov -d . --config-file ../.checkov.yaml --quiet --compact

      - name: terraform plan
        id: plan
        run: |
          terraform plan -var-file=${{ matrix.environment }}.tfvars -no-color -out=tfplan | tee plan_output.txt
        continue-on-error: true

      - name: Comentar el plan en el PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('live/plan_output.txt', 'utf8').slice(-60000);
            const body = `#### Plan Terraform — ${{ matrix.environment }}\n\`\`\`\n${output}\n\`\`\``;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fallar si el plan falló
        if: steps.plan.outcome == 'failure'
        run: exit 1
