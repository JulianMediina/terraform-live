name: infra-apply

on:
  push:
    branches: [main]
    paths:
      - "live/**"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.8"

jobs:
  apply-integracion:
    runs-on: ubuntu-latest
    environment: integracion
    defaults:
      run:
        working-directory: live
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: terraform init -backend-config=integracion.s3.tfbackend -reconfigure -input=false
      - run: terraform apply -var-file=integracion.tfvars -auto-approve -input=false

  # laboratorio y produccion requieren revisores configurados en cada
  # GitHub Environment (Settings > Environments); "needs" garantiza el orden
  # de promoción integracion -> laboratorio -> produccion.
  apply-laboratorio:
    runs-on: ubuntu-latest
    needs: apply-integracion
    environment: laboratorio
    defaults:
      run:
        working-directory: live
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: terraform init -backend-config=laboratorio.s3.tfbackend -reconfigure -input=false
      - run: terraform apply -var-file=laboratorio.tfvars -auto-approve -input=false

  apply-produccion:
    runs-on: ubuntu-latest
    needs: apply-laboratorio
    environment: produccion
    defaults:
      run:
        working-directory: live
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - run: terraform init -backend-config=produccion.s3.tfbackend -reconfigure -input=false
      - run: terraform apply -var-file=produccion.tfvars -auto-approve -input=false
