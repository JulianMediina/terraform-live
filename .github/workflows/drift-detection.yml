name: drift-detection

on:
  schedule:
    - cron: "0 12 * * *" # diario, 12:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  issues: write

env:
  TF_VERSION: "1.9.8"

jobs:
  detect:
    strategy:
      fail-fast: false
      matrix:
        environment: [integracion, laboratorio, produccion]
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    defaults:
      run:
        working-directory: live
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - run: terraform init -backend-config=${{ matrix.environment }}.s3.tfbackend -reconfigure -input=false

      - name: terraform plan (detailed-exitcode)
        id: plan
        run: |
          set +e
          terraform plan -var-file=${{ matrix.environment }}.tfvars -detailed-exitcode -no-color -out=/dev/null
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Abrir incidencia si hay drift
        if: steps.plan.outputs.exit_code == '2'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Drift detectado en ${{ matrix.environment }}`,
              labels: ["drift", "${{ matrix.environment }}"],
              body: "El plan programado detectó diferencias entre el estado de Terraform y la infraestructura real. Revisar el log del workflow y ejecutar `make plan ENV=${{ matrix.environment }}` para diagnosticar antes de aplicar.",
            });

      - name: Fallar si el plan tuvo un error real
        if: steps.plan.outputs.exit_code == '1'
        run: exit 1
