name: apply-produccion

# El Environment "produccion" tiene revisor requerido — aprobación real de
# cuatro ojos antes de que este job corra, además de la revisión del PR.
on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "live/**"

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.9.8"
  ENVIRONMENT: produccion

jobs:
  apply:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: produccion
    defaults:
      run:
        working-directory: live
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - run: terraform init -backend-config=${{ env.ENVIRONMENT }}.s3.tfbackend -reconfigure -input=false
      - run: terraform apply -var-file=${{ env.ENVIRONMENT }}.tfvars -auto-approve -input=false
